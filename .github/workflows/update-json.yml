
name: Güncelleme Bilgilerini Otomatik Güncelle

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sürüm bilgilerini güncelle
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python3 - <<'PY'
          import json
          import os

          path = "update.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          tag = os.environ["RELEASE_TAG"]
          version = tag[1:] if tag.startswith("v") else tag

          data["versionCode"] = int(data["versionCode"]) + 1
          data["versionName"] = version
          data["releaseUrl"] = "https://github.com/tete1071/hadi-namaza-guncelleme/releases/latest"
          data["notes"] = os.environ.get("RELEASE_BODY") or f"Hadi Namaza {version} sürümü yayımlandı."

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Güncelleme bilgilerini otomatik yenile"
            git push origin HEAD:main
          fi
